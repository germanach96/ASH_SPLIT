<title>Ashford — Product tree</title>
<style>
  :root {
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;

    --ground: #eef2f3;
    --panel: #ffffff;
    --panel-2: #f6f9fa;
    --canvas-bg: #f8fafb;
    --ink: #101a1e;
    --ink-2: #46585f;
    --ink-3: #7a8b93;
    --rule: #d3dee1;
    --rule-2: #e5edef;

    --fg: #b8460f;
    --blk: #0f766e;
    --wip: #2f6ba8;
    --cmp: #8896a2;
    --fg-soft: #f5e2d8;
    --blk-soft: #d8ebe8;
    --wip-soft: #dbe7f4;
    --cmp-soft: #e3e9ec;

    --edge: #b3c2c7;
    --edge-hot: #0f766e;
    --cluster: #eaf0f2;
    --cluster-line: #d9e3e6;
    --focus: #0f766e;
    --pick: #b5179e;
    --pick-soft: #f7e0f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #080d0f; --panel: #101a1d; --panel-2: #162226; --canvas-bg: #0b1315;
      --ink: #e2ecef; --ink-2: #9fb3ba; --ink-3: #6c8189; --rule: #213238; --rule-2: #1a282d;
      --fg: #e8763c; --blk: #3fb5a6; --wip: #68a8e0; --cmp: #7d8f9a;
      --fg-soft: #33200f; --blk-soft: #0e2d2b; --wip-soft: #12253a; --cmp-soft: #1b262a;
      --edge: #2c4046; --edge-hot: #3fb5a6; --cluster: #101b1f; --cluster-line: #1e2f35; --focus: #3fb5a6;
      --pick: #f07ad0; --pick-soft: #3a1030;
    }
  }
  :root[data-theme="dark"] {
    --ground: #080d0f; --panel: #101a1d; --panel-2: #162226; --canvas-bg: #0b1315;
    --ink: #e2ecef; --ink-2: #9fb3ba; --ink-3: #6c8189; --rule: #213238; --rule-2: #1a282d;
    --fg: #e8763c; --blk: #3fb5a6; --wip: #68a8e0; --cmp: #7d8f9a;
    --fg-soft: #33200f; --blk-soft: #0e2d2b; --wip-soft: #12253a; --cmp-soft: #1b262a;
    --edge: #2c4046; --edge-hot: #3fb5a6; --cluster: #101b1f; --cluster-line: #1e2f35; --focus: #3fb5a6;
    --pick: #f07ad0; --pick-soft: #3a1030;
  }
  :root[data-theme="light"] {
    --ground: #eef2f3; --panel: #ffffff; --panel-2: #f6f9fa; --canvas-bg: #f8fafb;
    --ink: #101a1e; --ink-2: #46585f; --ink-3: #7a8b93; --rule: #d3dee1; --rule-2: #e5edef;
    --fg: #b8460f; --blk: #0f766e; --wip: #2f6ba8; --cmp: #8896a2;
    --fg-soft: #f5e2d8; --blk-soft: #d8ebe8; --wip-soft: #dbe7f4; --cmp-soft: #e3e9ec;
    --edge: #b3c2c7; --edge-hot: #0f766e; --cluster: #eaf0f2; --cluster-line: #d9e3e6; --focus: #0f766e;
    --pick: #b5179e; --pick-soft: #f7e0f2;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.5;
    height: 100vh; overflow: hidden;
  }
  #app { display: grid; grid-template-columns: 272px minmax(0,1fr) 272px; grid-template-rows: auto minmax(0,1fr); height: 100vh; }

  #bar {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--rule);
  }
  #brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
  #brand b { font-family: var(--mono); font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  #brand span { font-family: var(--mono); font-size: 11px; color: var(--ink-3); letter-spacing: .08em; }
  .legend { display: flex; gap: 15px; flex-wrap: wrap; }
  .lg { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; letter-spacing: .05em; color: var(--ink-2); white-space: nowrap; }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .dot.fg { background: var(--fg); }
  .dot.blk { background: var(--blk); }
  .dot.wip { background: var(--wip); }
  .dot.cmp { background: var(--panel); border: 2px solid var(--cmp); }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .split { display: flex; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .split button { border: 0; border-radius: 0; border-left: 1px solid var(--rule); }
  .split button:first-child { border-left: 0; }

  button, select {
    font-family: var(--mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink-2); background: var(--panel-2); border: 1px solid var(--rule);
    border-radius: 2px; padding: 6px 11px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--focus); color: var(--ink); }
  button:disabled { opacity: .42; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  button[aria-pressed="true"] { background: var(--blk-soft); border-color: var(--blk); color: var(--ink); }
  .split button[aria-pressed="true"] { border-left-color: var(--blk); }

  aside { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  #left { border-right: 1px solid var(--rule); }
  #right { border-left: 1px solid var(--rule); }
  .sec { padding: 12px 14px; border-bottom: 1px solid var(--rule-2); }
  .sec h2 { margin: 0 0 9px; font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-3); }

  #tabs { display: flex; border-bottom: 1px solid var(--rule); }
  #tabs button {
    flex: 1; border: 0; border-radius: 0; border-bottom: 2px solid transparent;
    background: none; padding: 11px 4px; font-size: 11px;
  }
  #tabs button[aria-selected="true"] { border-bottom-color: var(--blk); color: var(--ink); background: var(--panel-2); }

  .pane { display: none; flex-direction: column; min-height: 0; flex: 1; }
  .pane.on { display: flex; }
  #search, #msearch {
    width: 100%; font-family: var(--mono); font-size: 12px; padding: 8px 10px;
    color: var(--ink); background: var(--panel-2); border: 1px solid var(--rule); border-radius: 2px;
  }
  #search::placeholder, #msearch::placeholder { color: var(--ink-3); }
  .filters { display: flex; gap: 5px; margin-top: 8px; }
  .filters button { flex: 1; padding: 5px 2px; }

  .scroller { flex: 1; overflow-y: auto; min-height: 0; padding: 4px 0 14px; }
  .row {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    padding: 6px 14px; border: 0; border-left: 2px solid transparent; border-radius: 0;
    background: none; text-transform: none; letter-spacing: .02em; font-size: 12px;
    font-family: var(--mono); color: var(--ink); cursor: pointer;
  }
  .row:hover { background: var(--panel-2); border-left-color: var(--rule); }
  .row[aria-current="true"], .row[aria-pressed="true"] { background: var(--blk-soft); border-left-color: var(--blk); }
  .row .meta { margin-left: auto; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tick {
    width: 13px; height: 13px; flex: none; border: 1px solid var(--rule); border-radius: 2px;
    display: grid; place-items: center; font-size: 9px; color: var(--panel); background: var(--panel-2);
  }
  .row[aria-pressed="true"] .tick { background: var(--blk); border-color: var(--blk); }
  .op { font-size: 10px; color: var(--ink-3); }
  .count { padding: 8px 14px; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; color: var(--ink-3); }
  .bulk { display: flex; gap: 5px; margin-top: 8px; }
  .bulk button { flex: 1; padding: 5px 2px; }

  #stage { position: relative; background: var(--canvas-bg); min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.grabbing { cursor: grabbing; }
  canvas.marquee { cursor: crosshair; }
  canvas.on-node { cursor: pointer; }   /* after .marquee, so a point beats the box cursor */
  button[aria-pressed="true"].pick { background: var(--pick-soft); border-color: var(--pick); color: var(--ink); }
  /* The slot is always reserved. If the counter appeared on the first mark the
     toolbar would grow and the drawing would jump under the cursor. */
  #picked {
    font-family: var(--mono); font-size: 11px; color: var(--pick); letter-spacing: .06em;
    white-space: nowrap; min-width: 13ch; visibility: hidden;
  }
  #picked.on { visibility: visible; }

  #selbox { display: flex; flex-direction: column; gap: 9px; }
  #selchips { display: flex; flex-wrap: wrap; gap: 4px; max-height: 132px; overflow-y: auto; }
  #selchips .chip { border-color: var(--pick); color: var(--pick); background: var(--pick-soft); }
  .selacts { display: flex; gap: 5px; }
  .selacts button { flex: 1; padding: 6px 4px; }

  #modal {
    position: fixed; inset: 0; z-index: 20; display: none; place-items: center;
    /* Fixed dark scrim. Keyed to var(--ink) it turned almost white in dark
       theme and washed the page out instead of dimming it. */
    background: rgba(6, 12, 14, .58); padding: 24px;
  }
  #modal.on { display: grid; }
  #modal .sheet {
    background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
    width: min(760px, 100%); max-height: 86vh; display: flex; flex-direction: column;
  }
  #modal header { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-bottom: 1px solid var(--rule); }
  #modal h2 { margin: 0; margin-right: auto; font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
  #csv {
    flex: 1; min-height: 240px; margin: 0; border: 0; border-bottom: 1px solid var(--rule); resize: none;
    padding: 14px 16px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6;
    color: var(--ink); background: var(--panel-2); white-space: pre; overflow: auto;
  }
  #modal footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px; }
  #modal footer .note { margin: 0; margin-right: auto; }
  #hint {
    position: absolute; left: 14px; bottom: 12px; display: flex; gap: 14px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 10px; letter-spacing: .06em; color: var(--ink-3);
    pointer-events: none; text-transform: uppercase;
  }
  #scope {
    position: absolute; left: 14px; top: 12px; max-width: min(520px, calc(100% - 28px));
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    background: color-mix(in srgb, var(--panel) 88%, transparent);
    border: 1px solid var(--rule); border-radius: 2px; padding: 7px 11px; pointer-events: none;
  }
  #scope b { color: var(--ink); font-weight: 700; }
  #busy {
    position: absolute; inset: 0; display: none; place-items: center;
    background: color-mix(in srgb, var(--canvas-bg) 82%, transparent);
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
  }
  #busy.on { display: grid; }

  #detail { flex: 1; overflow-y: auto; min-height: 0; }
  #dcode { font-family: var(--mono); font-size: 17px; font-weight: 700; word-break: break-all; margin: 0 0 8px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; padding: 4px 9px; border-radius: 2px; }
  .badge.fg { background: var(--fg-soft); color: var(--fg); }
  .badge.blk { background: var(--blk-soft); color: var(--blk); }
  .badge.wip { background: var(--wip-soft); color: var(--wip); }
  .badge.cmp { background: var(--cmp-soft); color: var(--ink-2); }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 10px; font-size: 12px; margin: 0; }
  .kv dt { color: var(--ink-2); }
  .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-family: var(--mono); font-size: 11px; padding: 3px 7px; border-radius: 2px; background: var(--panel-2); border: 1px solid var(--rule); color: var(--ink-2); }
  .chip i { font-style: normal; color: var(--ink-3); }
  .acts { display: flex; flex-direction: column; gap: 6px; }
  .acts button { text-align: left; }
  .empty { font-size: 12.5px; color: var(--ink-3); margin: 0; }
  .note { font-size: 11.5px; color: var(--ink-3); margin: 8px 0 0; line-height: 1.45; }

  @media (max-width: 1120px) {
    body { overflow: auto; height: auto; }
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(430px, 62vh) auto; height: auto; }
    aside { border: 0; border-top: 1px solid var(--rule); }
    #left { order: 3; } #stage { order: 2; min-height: 430px; } #right { order: 4; }
    .scroller { max-height: 300px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app">
  <header id="bar">
    <div id="brand"><b>Ashford</b><span>product tree</span></div>
    <div class="legend">
      <span class="lg"><i class="dot fg"></i>FG · finished good</span>
      <span class="lg"><i class="dot blk"></i>BLK · bulk</span>
      <span class="lg"><i class="dot wip"></i>WIP · work in progress</span>
      <span class="lg"><i class="dot cmp"></i>CMP · purchased</span>
    </div>
    <div class="tools">
      <div class="split" role="group" aria-label="Layout">
        <button id="lay-tree" aria-pressed="true">Hierarchy</button>
        <button id="lay-clu" aria-pressed="false">Clusters</button>
      </div>
      <button id="btn-links" aria-pressed="false" title="Sum the links between two clusters into a single line">Bundle links</button>
      <button id="btn-multi" class="pick" aria-pressed="false" title="Drag across the canvas to enclose points in a rectangle">Box select</button>
      <span id="picked"></span>
      <button id="btn-fit">Fit</button>
      <button id="btn-relayout">Re-layout</button>
      <button id="btn-all">Whole factory</button>
    </div>
  </header>

  <aside id="left">
    <div id="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-pane="codes">Codes</button>
      <button role="tab" aria-selected="false" data-pane="machines">Machines</button>
    </div>

    <div class="pane on" id="pane-codes">
      <div class="sec">
        <input id="search" type="search" placeholder="99200005400, TRM020642…" autocomplete="off" spellcheck="false" aria-label="Search code" />
        <div class="filters">
          <button data-filter="0" aria-pressed="true">FG</button>
          <button data-filter="1" aria-pressed="false">BLK</button>
          <button data-filter="2" aria-pressed="false">WIP</button>
          <button data-filter="3" aria-pressed="false">CMP</button>
        </div>
      </div>
      <div class="count" id="ccount"></div>
      <div class="scroller" id="clist"></div>
    </div>

    <div class="pane" id="pane-machines">
      <div class="sec">
        <input id="msearch" type="search" placeholder="P05M0565…" autocomplete="off" spellcheck="false" aria-label="Search machine" />
        <div class="bulk">
          <button data-bulk="0040">All 0040</button>
          <button data-bulk="0010">All 0010</button>
          <button data-bulk="none">Clear</button>
        </div>
      </div>
      <div class="count" id="mcount"></div>
      <div class="scroller" id="mlist"></div>
    </div>
  </aside>

  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="scope"></div>
    <div id="busy">Working…</div>
    <div id="hint">
      <span>Drag a point to move it</span>
      <span>Drag the background to pan</span>
      <span>Wheel to zoom</span>
      <span>Click to read the code</span>
    </div>
  </main>

  <aside id="right">
    <div class="sec" id="selbox">
      <h2 id="selhead">Selection</h2>
      <div id="selchips"></div>
      <div class="selacts">
        <button id="btn-export" disabled>Export</button>
        <button id="btn-clear" disabled>Clear</button>
      </div>
    </div>
    <div class="sec"><h2>Detail</h2></div>
    <div id="detail"></div>
  </aside>
</div>

<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle" hidden>
  <div class="sheet">
    <header>
      <h2 id="modaltitle">Export selection</h2>
      <div class="split">
        <button id="ex-codes" aria-pressed="true">Codes</button>
        <button id="ex-links" aria-pressed="false">Links</button>
      </div>
      <button id="ex-close">Close</button>
    </header>
    <textarea id="csv" readonly spellcheck="false" aria-label="CSV data"></textarea>
    <footer>
      <p class="note">Semicolon-separated, so Excel opens it straight into columns.</p>
      <button id="ex-copy">Copy</button>
      <button id="ex-download">Download CSV</button>
    </footer>
  </div>
</div>

 *   CMP  no machine at all, so Ashford buys it
 *   BLK  made on a P05M machine, bulk — including the 153 that ship as they are
 *   FG   made on a P05P machine and consumed by nothing, so it ships
 *   WIP  made on a P05P machine but consumed by something else
 *
 * No code in the data runs on both a P05M and a P05P machine, so the prefix
 * decides on its own and the rule never has to break a tie. */
const FG = 0, BLK = 1, WIP = 2, CMP = 3;
const KIND_CODE = ["FG", "BLK", "WIP", "CMP"];
const KIND_NAME = ["Finished good", "Bulk", "Work in progress", "Purchased"];
const KIND_CLASS = ["fg", "blk", "wip", "cmp"];
const KIND_NOTE = [
  "Packed on a P05P machine and consumed by nothing, so it ships.",
  "Made on a P05M machine. Bulks count as bulk even when they ship as they are.",
  "Packed on a P05P machine, then consumed by another code.",
  "No machine in the RATE sheet, so Ashford buys it."
];

const MACH_IS_BULK = MACHINES.map(m => m.startsWith("P05M"));
const KIND = new Uint8Array(N);
for (let i = 0; i < N; i++) {
  if (M_OFF[i + 1] === M_OFF[i]) { KIND[i] = CMP; continue; }
  let bulk = false;
  for (let e = M_OFF[i]; e < M_OFF[i + 1]; e++) if (MACH_IS_BULK[M_IDX[e]]) { bulk = true; break; }
  KIND[i] = bulk ? BLK : (nPa(i) === 0 ? FG : WIP);
}

/* Clusters keyed on the whole set of machines a code can run on, not on one
 * chosen machine. A code that can be made on P05P0502 and P05P0506 lands in its
 * own 0502+0506 cluster, separate from the codes tied to either machine alone,
 * so the fluidity is visible instead of being flattened away. That splits the
 * 63 machines into 95 clusters, and the bulks into the most sub-groups.
 *
 * The set comes from RATE and never changes, so the ids are built once here. */
const CLUSTER = new Int32Array(N);
const CLUSTER_META = [];
{
  const byKey = new Map();
  for (let i = 0; i < N; i++) {
    // M_IDX is emitted sorted per code, so the key is already canonical.
    const ms = Array.from(M_IDX.subarray(M_OFF[i], M_OFF[i + 1]));
    const key = ms.length ? ms.join(",") : "CMP";
    let id = byKey.get(key);
    if (id === undefined) {
      id = CLUSTER_META.length;
      byKey.set(key, id);
      // Machine names all start with P05, so dropping it on the multi-machine
      // labels buys room without losing anything. Past two names the label
      // outgrows the box, so the rest become a count and the full set stays in
      // the detail panel. This caps every label at 13 characters.
      const short = ms.map(m => MACHINES[m].slice(3));
      CLUSTER_META.push({
        machines: ms,
        cmp: ms.length === 0,
        label: !ms.length ? "PURCHASED"
          : ms.length === 1 ? MACHINES[ms[0]]
          : ms.length === 2 ? short.join("+")
          : short.slice(0, 2).join("+") + "+" + (ms.length - 2),
        op: ms.length ? MOPS[ms[0]] : ""
      });
    }
    CLUSTER[i] = id;
  }
}
const NC = CLUSTER_META.length;

// Reverse index: machine -> the codes it produces.
const MACH_NODES = Array.from({ length: NM }, () => []);
for (let i = 0; i < N; i++)
  for (let e = M_OFF[i]; e < M_OFF[i + 1]; e++) MACH_NODES[M_IDX[e]].push(i);

/* ================================================================== *
 * View state
 *
 * Positions and membership live in typed arrays indexed by global code: with
 * 48,756 edges, a Map lookup per node shows up on every redraw.
 * ================================================================== */
const PX = new Float64Array(N), PY = new Float64Array(N);
const INVIEW = new Uint8Array(N), LVL = new Int32Array(N);

let view = { nodes: new Int32Array(0), edges: new Int32Array(0), big: false, r: 9, labels: true, clusters: [], banners: [] };
let scope = { kind: "code", seeds: [], dir: "both", label: "" };
let layoutMode = "tree", groupLinks = false, autoGroup = true;
let selected = -1, hovered = -1;

// Box selection. Kept outside the view and indexed by global code, so changing
// scope does not lose what is already marked, which is what you expect from a
// selection that accumulates.
const MARKED = new Uint8Array(N);
let nMarked = 0, multiMode = false, band = null;

/** Transitive closure upwards (consumers) and/or downwards (components). */
function collect(seeds, dir) {
  INVIEW.fill(0);
  const out = [];
  const walk = (off, idx) => {
    const stack = seeds.slice();
    for (const s of seeds) if (!INVIEW[s]) { INVIEW[s] = 1; out.push(s); }
    while (stack.length) {
      const n = stack.pop();
      for (let e = off[n]; e < off[n + 1]; e++) {
        const m = idx[e];
        if (!INVIEW[m]) { INVIEW[m] = 1; out.push(m); stack.push(m); }
      }
    }
  };
  // Upwards first, so everything reaches the products that ship it.
  if (dir !== "down") walk(PA_OFF, PA_IDX);
  if (dir !== "up") walk(CH_OFF, CH_IDX);

  const edges = [];
  for (const n of out)
    for (let e = CH_OFF[n]; e < CH_OFF[n + 1]; e++) if (INVIEW[CH_IDX[e]]) edges.push(n, CH_IDX[e]);
  return { nodes: Int32Array.from(out), edges: Int32Array.from(edges) };
}

/* ------------------------------------------------------------------ *
 * Layered layout: what ships on top, arrows pointing down
 * ------------------------------------------------------------------ */
/** Fills LVL by longest path from the subgraph roots, so level 0 is whatever
 *  nothing consumes. Shared by both layouts: the clustered one needs the same
 *  depths to stack its blocks. */
function topoLevels(nodes, edges) {
  const indeg = new Int32Array(N);
  for (let i = 0; i < edges.length; i += 2) indeg[edges[i + 1]]++;
  for (const n of nodes) LVL[n] = 0;

  const deg = Int32Array.from(indeg);
  const queue = [], order = [];
  for (const n of nodes) if (deg[n] === 0) queue.push(n);
  for (let h = 0; h < queue.length; h++) {
    const n = queue[h]; order.push(n);
    for (let e = CH_OFF[n]; e < CH_OFF[n + 1]; e++) {
      const c = CH_IDX[e];
      if (!INVIEW[c]) continue;
      if (LVL[c] < LVL[n] + 1) LVL[c] = LVL[n] + 1;
      if (--deg[c] === 0) queue.push(c);
    }
  }
  for (const n of nodes) if (order.length < nodes.length && deg[n] > 0) order.push(n);

  let maxLvl = 0;
  for (const n of nodes) if (LVL[n] > maxLvl) maxLvl = LVL[n];
  return { order, maxLvl };
}

function layoutLayered(nodes, edges) {
  const { order, maxLvl } = topoLevels(nodes, edges);
  const bands = Array.from({ length: maxLvl + 1 }, () => []);
  for (const n of order) bands[LVL[n]].push(n);

  // Barycentre sweep: each node drifts towards the mean position of its
  // neighbours on the adjacent layer, which cuts down crossing arrows.
  const rank = new Int32Array(N).fill(-1);
  const reindex = () => bands.forEach(b => b.forEach((n, i) => rank[n] = i));
  const mean = (n, off, idx) => {
    let s = 0, c = 0;
    for (let e = off[n]; e < off[n + 1]; e++) { const m = idx[e]; if (rank[m] >= 0) { s += rank[m]; c++; } }
    return c ? s / c : rank[n];
  };
  reindex();
  const sweeps = nodes.length > 3000 ? 1 : 4;
  for (let s = 0; s < sweeps; s++) {
    for (let L = 1; L <= maxLvl; L++) { bands[L].sort((a, b) => mean(a, PA_OFF, PA_IDX) - mean(b, PA_OFF, PA_IDX)); reindex(); }
    for (let L = maxLvl - 1; L >= 0; L--) { bands[L].sort((a, b) => mean(a, CH_OFF, CH_IDX) - mean(b, CH_OFF, CH_IDX)); reindex(); }
  }

  // A level can fan out into dozens of purchased codes. On a single row the
  // drawing stretches until the labels stop being readable, so wide levels wrap
  // onto several rows. The gap between levels stays larger than the gap between
  // rows of one level, so the hierarchy still reads top to bottom.
  //
  const big = nodes.length > 400;
  const xgap = big ? 24 : 128, rowGap = big ? 34 : 62, bandGap = big ? 190 : 132;
  const perRow = bands.map(b => Math.max(1, Math.min(b.length, Math.ceil(Math.sqrt(b.length * 2.6)))));
  const width = Math.max(...bands.map((b, i) => Math.min(b.length, perRow[i]))) * xgap;

  let y = 0;
  bands.forEach((band, L) => {
    const cols = perRow[L], rows = Math.ceil(band.length / cols);
    band.forEach((n, i) => {
      const row = (i / cols) | 0, col = i % cols;
      const len = Math.min(cols, band.length - row * cols);
      PX[n] = (width - len * xgap) / 2 + col * xgap + xgap / 2;
      PY[n] = y + row * rowGap;
    });
    y += (rows - 1) * rowGap + bandGap;
  });

  return { big, r: big ? 3.2 : 9, labels: !big, clusters: [], banners: [] };
}

/* ------------------------------------------------------------------ *
 * Clustered layout: one block per machine set, stacked by depth
 * ------------------------------------------------------------------ */
function layoutClusters(nodes, edges) {
  topoLevels(nodes, edges);

  const groups = new Map();          // cluster id -> codes
  for (const n of nodes) {
    const g = CLUSTER[n];
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(n);
  }

  // Minimum width so the label always fits. Without it, small boxes let their
  // label spill over the block next door.
  const gap = 15, pad = 20, head = 36, minW = 142;
  const boxes = [...groups].map(([id, list]) => {
    const meta = CLUSTER_META[id];
    const cols = Math.max(1, Math.ceil(Math.sqrt(list.length * 1.25)));
    const rows = Math.ceil(list.length / cols);
    let sum = 0;
    for (const n of list) sum += LVL[n];
    return {
      id, list, cols, rows, meta,
      level: sum / list.length,
      w: Math.max(minW, cols * gap + pad * 2),
      h: rows * gap + pad * 2 + head
    };
  });

  // Blocks are stacked by the mean depth of the codes inside them, so the
  // machines that only turn out finished goods sit on top and the deepest bulks
  // at the bottom. It is deliberately approximate: a block whose codes sit on
  // several levels lands on their average.
  const cmpBoxes = boxes.filter(b => b.meta.cmp);
  const machBoxes = boxes.filter(b => !b.meta.cmp);
  const bands = new Map();
  for (const b of machBoxes) {
    const L = Math.round(b.level);
    if (!bands.has(L)) bands.set(L, []);
    bands.get(L).push(b);
  }
  const levels = [...bands.keys()].sort((a, b) => a - b);

  // Shelf packing inside each band: boxes go left to right, biggest first, and
  // wrap once they pass the target width so the whole thing lands roughly
  // square.
  const area = machBoxes.reduce((s, b) => s + b.w * b.h, 0);
  const target = Math.max(...boxes.map(b => b.w), Math.sqrt(area * 1.5));
  const gapCol = 26, gapRow = 26, gapBand = 150;

  const clusters = [];
  const place = b => {
    const inset = (b.w - b.cols * gap) / 2;   // centre the grid in widened boxes
    b.list.forEach((n, i) => {
      PX[n] = b.x + inset + ((i % b.cols) + 0.5) * gap;
      PY[n] = b.y + head + pad + (((i / b.cols) | 0) + 0.5) * gap;
    });
    clusters.push({
      x: b.x, y: b.y, w: b.w, h: b.h,
      label: b.meta.label,
      sub: b.meta.cmp ? `${b.list.length} codes`
        : `op ${b.meta.op} · ${b.meta.machines.length > 1 ? b.meta.machines.length + " mach · " : ""}${b.list.length}`
    });
  };

  let y = 0;
  const banners = [];
  for (const L of levels) {
    const band = bands.get(L).sort((a, b) => b.list.length - a.list.length);
    const top = y;
    let x = 0, rowH = 0;
    for (const b of band) {
      if (x > 0 && x + b.w > target) { x = 0; y += rowH + gapRow; rowH = 0; }
      b.x = x; b.y = y;
      rowH = Math.max(rowH, b.h);
      x += b.w + gapCol;
      place(b);
    }
    y += rowH;
    banners.push({ level: L, y: top, n: band.length, w: Math.max(target, x - gapCol) });
    y += gapBand;
  }
  const stackBottom = Math.max(0, y - gapBand);

  // Purchased codes hang off every level at once, so they get one block to the
  // right of the stack rather than a place in it.
  for (const b of cmpBoxes) {
    b.x = target + 90;
    b.y = Math.max(0, (stackBottom - b.h) / 2);
    place(b);
  }

  return {
    big: nodes.length > 400, r: nodes.length > 400 ? 3.4 : 6, labels: false,
    clusters, banners
  };
}

/* ================================================================== *
 * Applying a scope
 * ================================================================== */
function setScope(kind, seeds, dir, label) {
  scope = { kind, seeds, dir, label };
  const busy = document.getElementById("busy");
  busy.classList.add("on");
  // One spare frame so the notice paints before the thread blocks.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const { nodes, edges } = collect(seeds, dir);
    // Clustered blocks sit far apart, so individual edges cross the whole
    // drawing and pile into a grey mass much sooner than in the layered view.
    if (autoGroup) groupLinks = nodes.length > 2500 ||
      (layoutMode === "clusters" && edges.length / 2 > 2000);
    const L = layoutMode === "clusters" ? layoutClusters(nodes, edges) : layoutLayered(nodes, edges);
    view = { nodes, edges, ...L };
    buildLinkGroups();
    buildGrid();
    busy.classList.remove("on");
    syncTools();
    describeScope();
    renderSelection();   // how many marks fall in view changes
    fit();
    if (selected >= 0) select(selected);
  }));
}

function describeScope() {
  const c = [0, 0, 0, 0];
  for (const n of view.nodes) c[KIND[n]]++;
  const links = groupLinks && view.linkGroups
    ? `${view.linkGroups.length / 3} bundled links`
    : `${view.edges.length / 2} links`;
  document.getElementById("scope").innerHTML =
    `<b>${scope.label}</b> — ${view.nodes.length} codes, ${links} · ` +
    KIND_CODE.map((name, i) => `${c[i]} ${name}`).join(", ");
}

/** Sums the edges between two clusters into one line, thickness set by how
  *  many relations it stands for. This is what keeps the whole map light. */
function buildLinkGroups() {
  if (!groupLinks) { view.linkGroups = null; return; }
  const acc = new Map();
  for (let i = 0; i < view.edges.length; i += 2) {
    const a = CLUSTER[view.edges[i]], b = CLUSTER[view.edges[i + 1]];
    if (a === b) continue;
    acc.set(a * NC + b, (acc.get(a * NC + b) || 0) + 1);
  }
  const flat = [];
  for (const [key, c] of acc) flat.push((key / NC) | 0, key % NC, c);
  view.linkGroups = flat;
  // Centre of each cluster, to anchor the bundled lines.
  const cx = new Float64Array(NC), cy = new Float64Array(NC), cn = new Int32Array(NC);
  for (const n of view.nodes) { const g = CLUSTER[n]; cx[g] += PX[n]; cy[g] += PY[n]; cn[g]++; }
  for (let g = 0; g < NC; g++) if (cn[g]) { cx[g] /= cn[g]; cy[g] /= cn[g]; }
  view.cx = cx; view.cy = cy;
}

/* ================================================================== *
 * Canvas
 * ================================================================== */
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let k = 1, tx = 0, ty = 0, dpr = 1;

let pal = {};
function readPalette() {
  const s = getComputedStyle(document.documentElement);
  const g = p => s.getPropertyValue(p).trim();
  pal = {
    fg: g("--fg"), blk: g("--blk"), wip: g("--wip"), cmp: g("--cmp"), bg: g("--canvas-bg"),
    edge: g("--edge"), hot: g("--edge-hot"), ink: g("--ink"), ink2: g("--ink-2"), ink3: g("--ink-3"),
    cluster: g("--cluster"), clusterLine: g("--cluster-line"), mono: g("--mono"), pick: g("--pick")
  };
}

function resize() {
  // With tens of thousands of edges, painting at 2x quadruples the fill rate
  // for nothing: the points are 3 px across already.
  dpr = Math.min(window.devicePixelRatio || 1, view.big ? 1.25 : 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.max(1, Math.round(r.width * dpr));
  cv.height = Math.max(1, Math.round(r.height * dpr));
  draw();
}

function fit() {
  const r = cv.getBoundingClientRect();
  if (!view.nodes.length) return;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of view.nodes) {
    if (PX[n] < x0) x0 = PX[n]; if (PX[n] > x1) x1 = PX[n];
    if (PY[n] < y0) y0 = PY[n]; if (PY[n] > y1) y1 = PY[n];
  }
  const pad = 74;
  k = Math.min((r.width - pad * 2) / Math.max(1, x1 - x0), (r.height - pad * 2) / Math.max(1, y1 - y0));
  k = Math.max(0.006, Math.min(k, 1.6));
  tx = r.width / 2 - ((x0 + x1) / 2) * k;
  ty = r.height / 2 - ((y0 + y1) / 2) * k;
  draw();
}

/* --- spatial grid: find the point under the cursor without scanning 7,176 --- */
let grid = null;
function buildGrid() {
  const nodes = view.nodes;
  if (!nodes.length) { grid = null; return; }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const n of nodes) {
    if (PX[n] < x0) x0 = PX[n]; if (PX[n] > x1) x1 = PX[n];
    if (PY[n] < y0) y0 = PY[n]; if (PY[n] > y1) y1 = PY[n];
  }
  const cell = Math.max(12, Math.sqrt(((x1 - x0) * (y1 - y0)) / Math.max(1, nodes.length)) * 2);
  const cols = Math.max(1, Math.ceil((x1 - x0 + 1) / cell)), rows = Math.max(1, Math.ceil((y1 - y0 + 1) / cell));
  const buckets = Array.from({ length: cols * rows }, () => []);
  for (const n of nodes) {
    const c = Math.min(cols - 1, ((PX[n] - x0) / cell) | 0), r = Math.min(rows - 1, ((PY[n] - y0) / cell) | 0);
    buckets[r * cols + c].push(n);
  }
  grid = { x0, y0, cell, cols, rows, buckets };
}

function nodeAt(cx, cy) {
  if (!grid) return -1;
  const r = cv.getBoundingClientRect();
  const wx = (cx - r.left - tx) / k, wy = (cy - r.top - ty) / k;
  const reach = Math.max(view.r, 8 / k), reach2 = reach * reach;
  const c0 = Math.max(0, ((wx - reach - grid.x0) / grid.cell) | 0);
  const c1 = Math.min(grid.cols - 1, ((wx + reach - grid.x0) / grid.cell) | 0);
  const r0 = Math.max(0, ((wy - reach - grid.y0) / grid.cell) | 0);
  const r1 = Math.min(grid.rows - 1, ((wy + reach - grid.y0) / grid.cell) | 0);
  let best = -1, bd = Infinity;
  for (let rr = r0; rr <= r1; rr++)
    for (let cc = c0; cc <= c1; cc++)
      for (const n of grid.buckets[rr * grid.cols + cc]) {
        const dx = PX[n] - wx, dy = PY[n] - wy, d = dx * dx + dy * dy;
        if (d <= reach2 && d < bd) { bd = d; best = n; }
      }
  return best;
}

function draw() {
  const r = cv.getBoundingClientRect();
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  if (!view.nodes.length) return;
  ctx.setTransform(k * dpr, 0, 0, k * dpr, tx * dpr, ty * dpr);

  // A focus outside the current view would dim every point and highlight none,
  // which happens whenever the scope changes under a selected code.
  const R = view.r;
  let focus = hovered >= 0 ? hovered : selected;
  if (focus >= 0 && !INVIEW[focus]) focus = -1;
  const near = focus >= 0 ? new Set([focus]) : null;
  if (near) {
    for (let e = CH_OFF[focus]; e < CH_OFF[focus + 1]; e++) near.add(CH_IDX[e]);
    for (let e = PA_OFF[focus]; e < PA_OFF[focus + 1]; e++) near.add(PA_IDX[e]);
  }

  // Level rules first, under everything: a hairline stays visible at any zoom,
  // whereas the banner text disappears once it drops below 5 real pixels.
  ctx.strokeStyle = pal.clusterLine; ctx.lineWidth = 1 / k; ctx.globalAlpha = 1;
  for (const b of view.banners) {
    if (b.level === 0) continue;
    ctx.beginPath(); ctx.moveTo(0, b.y - 76); ctx.lineTo(b.w, b.y - 76); ctx.stroke();
  }

  // Cluster boxes.
  for (const c of view.clusters) {
    ctx.globalAlpha = 1;
    ctx.fillStyle = pal.cluster; ctx.strokeStyle = pal.clusterLine; ctx.lineWidth = 1 / k;
    ctx.beginPath(); ctx.rect(c.x, c.y, c.w, c.h); ctx.fill(); ctx.stroke();
  }

  if (groupLinks && view.linkGroups) {
    // One line per pair of clusters, thickness proportional to the relations.
    const L = view.linkGroups;
    let maxw = 1;
    for (let i = 2; i < L.length; i += 3) if (L[i] > maxw) maxw = L[i];
    // Kept faint and thin: stacking the clusters by level made these lines long
    // enough that a few hundred of them piled into a grey mass over the blocks.
    ctx.strokeStyle = pal.edge; ctx.globalAlpha = .2;
    for (let i = 0; i < L.length; i += 3) {
      const a = L[i], b = L[i + 1];
      ctx.lineWidth = Math.max(0.5, (L[i + 2] / maxw) * 3.5) / k;
      ctx.beginPath(); ctx.moveTo(view.cx[a], view.cy[a]); ctx.lineTo(view.cx[b], view.cy[b]); ctx.stroke();
    }
  } else {
    // Two passes over the edges with no intermediate lists: at 48,756 edges,
    // allocating arrays on every redraw is measurable.
    const E = view.edges, curve = !view.big && !view.clusters.length;
    const pass = (wantHot, color, width, alpha) => {
      ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = width / k;
      ctx.beginPath();
      for (let i = 0; i < E.length; i += 2) {
        const a = E[i], b = E[i + 1];
        const hot = near ? (a === focus || b === focus) : false;
        if (hot !== wantHot) continue;
        ctx.moveTo(PX[a], PY[a] + R);
        if (curve) {
          const m = (PY[b] - PY[a]) * 0.42;
          ctx.bezierCurveTo(PX[a], PY[a] + R + m, PX[b], PY[b] - R - m, PX[b], PY[b] - R);
        } else ctx.lineTo(PX[b], PY[b] - R);
      }
      ctx.stroke();
    };
    // Same reason: long edges between blocks need to be fainter than the short
    // parent-to-child hops of the layered view.
    pass(false, pal.edge, 1.1, near ? 0.24 : (view.clusters.length ? 0.3 : 0.8));
    if (near) pass(true, pal.hot, 1.9, 1);

    if (curve && k > 0.42) {
      ctx.globalAlpha = 1; ctx.fillStyle = pal.edge; ctx.beginPath();
      for (let i = 0; i < E.length; i += 2) {
        const b = E[i + 1], h = 7 / k, w = 4 / k;
        ctx.moveTo(PX[b], PY[b] - R); ctx.lineTo(PX[b] - w, PY[b] - R - h); ctx.lineTo(PX[b] + w, PY[b] - R - h);
      }
      ctx.fill();
    }
  }

  // Points.
  const cols = [pal.fg, pal.blk, pal.wip, pal.cmp];
  ctx.lineWidth = 2 / k;
  for (const n of view.nodes) {
    const dim = near && !near.has(n);
    ctx.globalAlpha = dim ? 0.26 : 1;
    ctx.beginPath();
    ctx.arc(PX[n], PY[n], n === selected ? R * 1.5 : R, 0, 6.2832);
    // Purchased codes are drawn hollow: nothing hangs below them.
    if (KIND[n] === CMP) { ctx.fillStyle = pal.bg; ctx.fill(); ctx.strokeStyle = cols[CMP]; ctx.stroke(); }
    else { ctx.fillStyle = cols[KIND[n]]; ctx.fill(); }
    if (n === selected || n === hovered) { ctx.strokeStyle = pal.ink; ctx.stroke(); }
  }

  // Marked points, over the rest so nothing covers them. Dense views fill the
  // point instead of ringing it: a ring keeps a fixed thickness in screen pixels
  // while its radius is in drawing units, so zooming out closes it over itself
  // and the marks merge into blobs. Filled, a point stays a point however tight
  // the neighbours are.
  if (nMarked) {
    ctx.globalAlpha = 1;
    if (view.big) {
      ctx.fillStyle = pal.pick;
      ctx.beginPath();
      for (const n of view.nodes) if (MARKED[n]) {
        ctx.moveTo(PX[n] + R, PY[n]);
        ctx.arc(PX[n], PY[n], R, 0, 6.2832);
      }
      ctx.fill();
    } else {
      ctx.strokeStyle = pal.pick; ctx.lineWidth = 2.4 / k;
      ctx.beginPath();
      for (const n of view.nodes) if (MARKED[n]) {
        ctx.moveTo(PX[n] + R * 2, PY[n]);
        ctx.arc(PX[n], PY[n], R * 2, 0, 6.2832);
      }
      ctx.stroke();
    }
  }

  // Cluster labels and graph codes are sized in drawing units, not screen pixels,
  // so they shrink with the zoom alongside the box holding them and never ride
  // over the block next door. Below 5 real pixels they are unreadable, and
  // drawing them would only add noise.
  ctx.globalAlpha = 1; ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";
  if (k * 13 >= 5) {
    // Level banner above each band, so the vertical order reads as depth.
    ctx.fillStyle = pal.ink3; ctx.font = `600 13px ${pal.mono}`;
    for (const b of view.banners)
      ctx.fillText(`LEVEL ${b.level}${b.level === 0 ? " · ships" : ""}`, 0, b.y - 14);
    for (const c of view.clusters) {
      ctx.fillStyle = pal.ink2; ctx.font = `600 13px ${pal.mono}`;
      ctx.fillText(c.label, c.x + 14, c.y + 17);
      ctx.fillStyle = pal.ink3; ctx.font = `10px ${pal.mono}`;
      ctx.fillText(c.sub, c.x + 14, c.y + 30);
    }
  }

  // Codes: all of them while the graph is small; on the big ones only the active
  // point, which is what keeps the whole map light.
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  if (view.labels && k * 11 >= 5) {
    ctx.font = `11px ${pal.mono}`;
    for (const n of view.nodes) {
      ctx.globalAlpha = near && !near.has(n) ? 0.3 : 1;
      ctx.fillStyle = n === selected || n === hovered ? pal.ink : pal.ink2;
      ctx.fillText(CODES[n], PX[n], PY[n] + R + 6);
    }
  } else {
    // With no standing labels, the active point gets a callout at constant size,
    // so it reads the same close up and far out.
    ctx.font = `${12 / k}px ${pal.mono}`;
    for (const n of [selected, hovered]) {
      if (n < 0 || !INVIEW[n]) continue;
      const w = ctx.measureText(CODES[n]).width;
      ctx.globalAlpha = .9; ctx.fillStyle = pal.bg;
      ctx.fillRect(PX[n] - w / 2 - 4 / k, PY[n] + R + 4 / k, w + 8 / k, 15 / k);
      ctx.globalAlpha = 1; ctx.fillStyle = pal.ink;
      ctx.fillText(CODES[n], PX[n], PY[n] + R + 6 / k);
    }
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The selection rectangle is drawn in screen coordinates: it follows the
  // cursor, not the drawing, the same as in any file manager.
  if (band) {
    const x = Math.min(band.x0, band.x1), y = Math.min(band.y0, band.y1);
    const w = Math.abs(band.x1 - band.x0), h = Math.abs(band.y1 - band.y0);
    ctx.fillStyle = pal.pick; ctx.globalAlpha = .12; ctx.fillRect(x, y, w, h);
    ctx.globalAlpha = .9; ctx.strokeStyle = pal.pick; ctx.lineWidth = 1;
    ctx.setLineDash([4, 3]); ctx.strokeRect(x + .5, y + .5, w, h); ctx.setLineDash([]);
    ctx.globalAlpha = 1;
  }
}

/* ================================================================== *
 * Interaction
 * ================================================================== */
let drag = null;
const local = ev => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
const world = ev => { const p = local(ev); return { x: (p.x - tx) / k, y: (p.y - ty) / k }; };

cv.addEventListener("pointerdown", ev => {
  cv.setPointerCapture(ev.pointerId);
  const n = nodeAt(ev.clientX, ev.clientY);
  const wantPan = ev.shiftKey || ev.button === 1;

  // In box-select mode the rectangle wins over moving a single point. The whole
  // map has a point on nearly every pixel, so requiring empty background to
  // start would make the rectangle impossible to begin there. Only an already
  // marked point starts a drag, and it drags the whole block.
  let mode;
  if (wantPan) mode = "pan";
  else if (multiMode) mode = (n >= 0 && MARKED[n]) ? "block" : "band";
  else mode = n >= 0 ? "node" : "pan";

  if (mode === "block") {
    drag = { mode, node: n, last: world(ev), moved: false };
  } else if (mode === "node") {
    const w = world(ev);
    drag = { mode, node: n, dx: PX[n] - w.x, dy: PY[n] - w.y, moved: false };
  } else if (mode === "band") {
    const p = local(ev);
    drag = { mode, node: n, moved: false };
    band = { x0: p.x, y0: p.y, x1: p.x, y1: p.y };
  } else {
    drag = { mode, node: n, x: ev.clientX - tx, y: ev.clientY - ty, moved: false };
    cv.classList.add("grabbing");
  }
});

cv.addEventListener("pointermove", ev => {
  if (drag) {
    drag.moved = true;
    if (drag.mode === "band") { const p = local(ev); band.x1 = p.x; band.y1 = p.y; }
    else if (drag.mode === "block") {
      const w = world(ev), dx = w.x - drag.last.x, dy = w.y - drag.last.y;
      for (const n of view.nodes) if (MARKED[n]) { PX[n] += dx; PY[n] += dy; }
      drag.last = w;
    } else if (drag.mode === "node") {
      const w = world(ev);
      PX[drag.node] = w.x + drag.dx; PY[drag.node] = w.y + drag.dy;
    } else { tx = ev.clientX - drag.x; ty = ev.clientY - drag.y; }
    draw();
    return;
  }
  const n = nodeAt(ev.clientX, ev.clientY);
  cv.classList.toggle("on-node", n >= 0);
  if (n !== hovered) { hovered = n; draw(); }
});

function endDrag() {
  if (!drag) return;
  if (!drag.moved) {
    // A click with no movement marks or unmarks; outside box-select mode it only
    // changes which point the detail panel shows.
    if (multiMode && drag.node >= 0) setMark(drag.node, !MARKED[drag.node]);
    select(drag.node);
  } else if (drag.mode === "band") markInBand();
  else if (drag.mode === "node" || drag.mode === "block") buildGrid();
  band = null;
  drag = null;
  cv.classList.remove("grabbing");
  draw();
}
cv.addEventListener("pointerup", endDrag);
cv.addEventListener("pointercancel", endDrag);
cv.addEventListener("pointerleave", () => { if (hovered !== -1) { hovered = -1; draw(); } });

/* --- box selection --- */
function setMark(n, on) {
  if (n < 0 || !!MARKED[n] === on) return;
  MARKED[n] = on ? 1 : 0; nMarked += on ? 1 : -1;
  renderSelection();
}

/** Marks every point in view whose centre falls inside the rectangle. It adds
  *  to what is marked and never clears an earlier selection. */
function markInBand() {
  const x0 = Math.min(band.x0, band.x1), x1 = Math.max(band.x0, band.x1);
  const y0 = Math.min(band.y0, band.y1), y1 = Math.max(band.y0, band.y1);
  let added = 0;
  for (const n of view.nodes) {
    if (MARKED[n]) continue;
    const sx = PX[n] * k + tx, sy = PY[n] * k + ty;
    if (sx >= x0 && sx <= x1 && sy >= y0 && sy <= y1) { MARKED[n] = 1; nMarked++; added++; }
  }
  if (added) renderSelection();
}

function clearMarks() {
  if (!nMarked) return;
  MARKED.fill(0); nMarked = 0;
  renderSelection(); draw();
}

function renderSelection() {
  const chips = document.getElementById("selchips");
  document.getElementById("btn-export").disabled = !nMarked;
  document.getElementById("btn-clear").disabled = !nMarked;
  const badge = document.getElementById("picked");
  badge.classList.toggle("on", nMarked > 0);
  badge.textContent = nMarked ? `${nMarked} selected` : "";

  const head = document.getElementById("selhead");
  if (!nMarked) {
    head.textContent = "Selection";
    chips.innerHTML = `<p class="empty">Turn on <b>Box select</b> and drag a rectangle across the canvas to enclose points. Every rectangle adds to what is already marked.</p>`;
    return;
  }
  let inView = 0;
  for (const n of view.nodes) if (MARKED[n]) inView++;
  head.textContent = `Selection — ${nMarked}${inView < nMarked ? ` · ${inView} in this view` : ""}`;

  const list = [];
  for (let i = 0; i < N && list.length < 300; i++) if (MARKED[i]) list.push(i);
  chips.innerHTML = list.map(i => `<span class="chip">${CODES[i]}</span>`).join("") +
    (nMarked > list.length ? `<span class="chip"><i>and ${nMarked - list.length} more</i></span>` : "");
}
cv.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const nk = Math.max(0.004, Math.min(6, k * Math.exp(-ev.deltaY * 0.0016)));
  tx = mx - (mx - tx) * (nk / k); ty = my - (my - ty) * (nk / k); k = nk;
  draw();
}, { passive: false });

/* ================================================================== *
 * Detail panel
 * ================================================================== */
function select(n) {
  selected = n;
  const box = document.getElementById("detail");
  if (n < 0) {
    box.innerHTML = `<div class="sec"><p class="empty">Pick a code or a machine on the left, or click a point in the graph.</p>
      <p class="note">Hollow points are codes Ashford buys. They have no machine in the RATE sheet,
      which is why nothing hangs below them.</p></div>`;
    draw(); return;
  }
  const ms = machinesOf(n);
  box.innerHTML = `
    <div class="sec">
      <p id="dcode">${CODES[n]}</p>
      <span class="badge ${KIND_CLASS[KIND[n]]}"><i class="dot ${KIND_CLASS[KIND[n]]}"></i>${KIND_CODE[KIND[n]]} · ${KIND_NAME[KIND[n]]}</span>
      <p class="note">${KIND_NOTE[KIND[n]]}</p>
    </div>
    <div class="sec">
      <h2>Structure</h2>
      <dl class="kv">
        <dt>Direct components</dt><dd>${nCh(n)}</dd>
        <dt>Used by</dt><dd>${nPa(n)} code${nPa(n) === 1 ? "" : "s"}</dd>
        <dt>Full explosion</dt><dd>${reach(n, CH_OFF, CH_IDX)}</dd>
        <dt>End products above</dt><dd>${endProductsAbove(n)}</dd>
        ${INVIEW[n] ? `<dt>Level in view</dt><dd>${LVL[n]}</dd>` : ""}
      </dl>
    </div>
    <div class="sec">
      <h2>Made on</h2>
      ${ms.length
        ? `<div class="chips">${ms.map(m => `<span class="chip">${MACHINES[m]} <i>op ${MOPS[m]}</i></span>`).join("")}</div>`
        : `<p class="empty">No machine assigned. Ashford buys this one.</p>`}
    </div>
    <div class="sec">
      <h2>Explore</h2>
      <div class="acts">
        <button data-act="both">Full context</button>
        <button data-act="down"${nCh(n) ? "" : " disabled"}>Explosion only</button>
        <button data-act="up"${nPa(n) ? "" : " disabled"}>Where used only</button>
      </div>
      <p class="note">Full context walks up to the products that ship this code and down to its raw materials.</p>
    </div>`;
  box.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const d = b.dataset.act;
    setScope("code", [n], d,
      d === "both" ? `Context of ${CODES[n]}` : d === "down" ? `Explosion of ${CODES[n]}` : `Where ${CODES[n]} is used`);
  });
  draw();
}

const reachCache = new Map();
function reach(n, off, idx) {
  const key = n * 2 + (off === CH_OFF ? 0 : 1);
  if (reachCache.has(key)) return reachCache.get(key);
  const seen = new Uint8Array(N), st = [n]; seen[n] = 1; let c = 0;
  while (st.length) {
    const x = st.pop(); c++;
    for (let e = off[x]; e < off[x + 1]; e++) if (!seen[idx[e]]) { seen[idx[e]] = 1; st.push(idx[e]); }
  }
  reachCache.set(key, c); return c;
}
/** Codes above this one that nothing consumes, so they are what actually ships.
 *  Counted by having no parent rather than by class, since the 153 bulks that
 *  ship as they are stay classified BLK. */
function endProductsAbove(n) {
  const seen = new Uint8Array(N), st = [n]; seen[n] = 1; let c = 0;
  while (st.length) {
    const x = st.pop();
    if (nPa(x) === 0) c++;
    for (let e = PA_OFF[x]; e < PA_OFF[x + 1]; e++) if (!seen[PA_IDX[e]]) { seen[PA_IDX[e]] = 1; st.push(PA_IDX[e]); }
  }
  return c;
}

/* ================================================================== *
 * Left panel
 * ================================================================== */
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
  document.querySelectorAll(".pane").forEach(p => p.classList.toggle("on", p.id === "pane-" + b.dataset.pane));
});

/* --- codes --- */
const search = document.getElementById("search");
let kindFilters = new Set([0]);
document.querySelectorAll("[data-filter]").forEach(b => b.onclick = () => {
  const f = +b.dataset.filter;
  if (kindFilters.has(f)) kindFilters.delete(f); else kindFilters.add(f);
  if (!kindFilters.size) kindFilters.add(f);
  document.querySelectorAll("[data-filter]").forEach(x => x.setAttribute("aria-pressed", kindFilters.has(+x.dataset.filter)));
  renderCodes();
});
search.addEventListener("input", renderCodes);

function renderCodes() {
  const q = search.value.trim().toUpperCase(), hits = [];
  for (let i = 0; i < N && hits.length < 400; i++)
    if (kindFilters.has(KIND[i]) && (!q || CODES[i].includes(q))) hits.push(i);
  document.getElementById("ccount").textContent =
    hits.length >= 400 ? "first 400 matches" : `${hits.length} code${hits.length === 1 ? "" : "s"}`;
  const list = document.getElementById("clist");
  list.innerHTML = hits.map(i => `
    <button class="row" data-i="${i}" aria-current="${scope.kind === "code" && scope.seeds[0] === i}">
      <i class="dot ${KIND_CLASS[KIND[i]]}"></i>${CODES[i]}
      <span class="meta">${nCh(i) ? nCh(i) + " comp." : "—"}</span>
    </button>`).join("");
  list.querySelectorAll(".row").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    layoutMode = "tree";
    select(i);
    setScope("code", [i], "both", `Context of ${CODES[i]}`);
  });
}

/* --- machines --- */
const msearch = document.getElementById("msearch");
let pickedMachines = new Set();
msearch.addEventListener("input", renderMachines);
document.querySelectorAll("[data-bulk]").forEach(b => b.onclick = () => {
  const w = b.dataset.bulk;
  pickedMachines = new Set();
  if (w !== "none") for (let m = 0; m < NM; m++) if (MOPS[m] === w) pickedMachines.add(m);
  renderMachines();
  applyMachines();
});

function renderMachines() {
  const q = msearch.value.trim().toUpperCase();
  const hits = [];
  for (let m = 0; m < NM; m++) if (!q || MACHINES[m].includes(q)) hits.push(m);
  hits.sort((a, b) => MACH_NODES[b].length - MACH_NODES[a].length);
  document.getElementById("mcount").textContent =
    `${hits.length} of ${NM} listed · ${pickedMachines.size} selected`;
  const list = document.getElementById("mlist");
  list.innerHTML = hits.map(m => `
    <button class="row" data-m="${m}" aria-pressed="${pickedMachines.has(m)}">
      <i class="tick">✓</i>${MACHINES[m]} <span class="op">op ${MOPS[m]}</span>
      <span class="meta">${MACH_NODES[m].length}</span>
    </button>`).join("");
  list.querySelectorAll(".row").forEach(b => b.onclick = () => {
    const m = +b.dataset.m;
    if (pickedMachines.has(m)) pickedMachines.delete(m); else pickedMachines.add(m);
    renderMachines();
    applyMachines();
  });
}

function applyMachines() {
  if (!pickedMachines.size) return;
  const seeds = [...new Set([].concat(...[...pickedMachines].map(m => MACH_NODES[m])))];
  const names = [...pickedMachines].map(m => MACHINES[m]).sort();
  layoutMode = "clusters";
  setScope("machines", seeds, "both",
    names.length === 1 ? `Machine ${names[0]}` : `${names.length} machines: ${names.slice(0, 3).join(", ")}${names.length > 3 ? "…" : ""}`);
}

/* ================================================================== *
 * Export
 *
 * Semicolon separator: it is what European Excel expects, so the file opens
 * straight into columns on a double click.
 * ================================================================== */
const SEP = ";";
const field = v => {
  const s = String(v);
  return /[";\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
};
const row = vs => vs.map(field).join(SEP);

function marked() {
  const out = [];
  for (let i = 0; i < N; i++) if (MARKED[i]) out.push(i);
  return out;
}

function csvCodigos() {
  const rows = [row(["Code", "Class", "ClassName", "DirectComponents", "UsedBy",
    "FullExplosion", "EndProductsAbove", "Machines", "Operations"])];
  for (const n of marked()) {
    const ms = machinesOf(n);
    rows.push(row([
      CODES[n], KIND_CODE[KIND[n]], KIND_NAME[KIND[n]], nCh(n), nPa(n),
      reach(n, CH_OFF, CH_IDX), endProductsAbove(n),
      ms.map(m => MACHINES[m]).join(" "),
      [...new Set(ms.map(m => MOPS[m]))].join(" ")
    ]));
  }
  return rows.join("\n");
}

/** Parent-component relations with both ends inside the selection. */
function csvRelaciones() {
  const rows = [row(["Parent", "Component", "ParentClass", "ComponentClass"])];
  for (const p of marked())
    for (let e = CH_OFF[p]; e < CH_OFF[p + 1]; e++) {
      const c = CH_IDX[e];
      if (MARKED[c]) rows.push(row([CODES[p], CODES[c], KIND_CODE[KIND[p]], KIND_CODE[KIND[c]]]));
    }
  return rows.join("\n");
}

const modal = document.getElementById("modal");
const csvBox = document.getElementById("csv");
let exportKind = "codes";

function renderExport() {
  document.getElementById("ex-codes").setAttribute("aria-pressed", exportKind === "codes");
  document.getElementById("ex-links").setAttribute("aria-pressed", exportKind === "links");
  csvBox.value = exportKind === "codes" ? csvCodigos() : csvRelaciones();
}
function openExport() {
  if (!nMarked) return;
  renderExport();
  modal.hidden = false; modal.classList.add("on");
  csvBox.focus(); csvBox.select();
}
function closeExport() { modal.classList.remove("on"); modal.hidden = true; }

document.getElementById("btn-export").onclick = openExport;
document.getElementById("btn-clear").onclick = clearMarks;
document.getElementById("ex-close").onclick = closeExport;
document.getElementById("ex-codes").onclick = () => { exportKind = "codes"; renderExport(); };
document.getElementById("ex-links").onclick = () => { exportKind = "links"; renderExport(); };
modal.addEventListener("click", ev => { if (ev.target === modal) closeExport(); });
addEventListener("keydown", ev => { if (ev.key === "Escape" && modal.classList.contains("on")) closeExport(); });

document.getElementById("ex-download").onclick = ev => {
  const name = `ashford_${exportKind === "codes" ? "codes" : "links"}_${nMarked}.csv`;
  // Leading byte-order mark so Excel keeps the accents.
  const blob = new Blob(["﻿" + csvBox.value], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  ev.target.textContent = "Downloaded";
  setTimeout(() => ev.target.textContent = "Download CSV", 1800);
};
document.getElementById("ex-copy").onclick = async ev => {
  const btn = ev.target;
  let ok = false;
  try { await navigator.clipboard.writeText(csvBox.value); ok = true; }
  catch { csvBox.focus(); csvBox.select(); try { ok = document.execCommand("copy"); } catch { ok = false; } }
  // If the browser blocks the clipboard the text stays selected in the box,
  // so copying it by hand still works.
  btn.textContent = ok ? "Copied" : "Press Ctrl+C";
  setTimeout(() => btn.textContent = "Copy", 2200);
};
